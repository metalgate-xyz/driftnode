syntax = "proto3";

package driftnode.v1;

option go_package = "driftnode/internal/proto/driftnodepb;driftnodepb";

// Driftnode is the control-plane API the daemon exposes to the CLI and TUI
// over a Unix domain socket. Unary RPCs cover one-shot commands; Subscribe is
// a server stream of typed events that replaces the old polling model.
service Driftnode {
  rpc Whoami(Empty) returns (WhoamiResp);
  rpc Follows(Empty) returns (IdentitiesResp);
  rpc Followers(Empty) returns (IdentitiesResp);
  rpc Post(PostReq) returns (PostResp);
  rpc Like(LikeReq) returns (LikeResp);
  rpc FetchLikes(FetchLikesReq) returns (FetchLikesResp);
  rpc Profile(ProfileReq) returns (EmptyResp);
  rpc Detail(DetailReq) returns (EmptyResp);
  rpc Zens(Empty) returns (ZensResp);
  rpc Verify(IdentityReq) returns (VerifyResp);
  rpc Unverify(IdentityReq) returns (VerifyResp);
  rpc Follow(FollowReq) returns (FollowResp);
  rpc Unfollow(UnfollowReq) returns (UnfollowResp);
  rpc Unlock(UnlockReq) returns (UnlockResp);
  rpc Lock(Empty) returns (EmptyResp);
  rpc Sync(Empty) returns (EmptyResp);
  rpc Stop(Empty) returns (EmptyResp);
  rpc Status(Empty) returns (StatusResp);
  rpc RotateKey(Empty) returns (RotateKeyResp);
  rpc Subscribe(SubscribeReq) returns (stream Event);
  rpc FeedPage(FeedPageReq) returns (FeedPageResp);
}

// Empty carries no parameters. Used by RPCs that need no input.
message Empty {}

// EmptyResp acknowledges a command with a status string.
message EmptyResp {
  string status = 1;
}

// WhoamiResp is the node's own identity and optional profile fields projected
// from the own logs.
message WhoamiResp {
  string identity = 1;
  string token = 2;
  bool stable = 3;
  string display_name = 4;
  bool has_avatar = 5;
  string bio = 6;
  string first_name = 7;
  string last_name = 8;
  string location = 9;
}

// IdentityReq targets one driftnode identity.
message IdentityReq {
  string identity = 1;
}

// VerifyResp reports the identity that was verified or unverified.
message VerifyResp {
  string identity = 1;
}

// FeedItem is one post in the merged timeline.
message FeedItem {
  string id = 1;
  int64 timestamp = 2;
  string author = 3;
  string name = 4;
  string text = 5;
  int32 like_count = 6;
  repeated string likers = 7;
}

// FeedPageReq returns a page of the merged timeline, newest-first. page is
// the 0-indexed page number (page 0 is the snapshot the subscribe stream
// sends). The page size is fixed server-side. mine filters to the user's own
// posts. all_likes triggers an on-demand like fetch from connected zens for
// the user's own posts in the returned page.
message FeedPageReq {
  int32 page = 1;
  bool mine = 2;
  bool all_likes = 3;
}

// FeedPageResp is one page of merged-timeline posts, newest-first, with a
// has_more flag indicating older posts remain.
message FeedPageResp {
  repeated FeedItem items = 1;
  bool has_more = 2;
}

// PostReq creates a post. Passphrase unlocks the signing key; omit when the
// daemon is already unlocked. ParentId, when non-empty, is the event ID of the
// post being replied to; a reply is a post with a parent.
message PostReq {
  string text = 1;
  string passphrase = 2;
  string parent_id = 3;
}

// PostResp reports the created event id.
message PostResp {
  string event_id = 1;
}

// LikeReq creates a Like event targeting the given post event id. Passphrase
// unlocks the signing key; omit when the daemon is already unlocked.
message LikeReq {
  string post_id = 1;
  string passphrase = 2;
}

// LikeResp reports the created event id.
message LikeResp {
  string event_id = 1;
}

// FetchLikesReq asks the daemon to query connected zens for Like events
// targeting the given post ids. This is an on-demand, best-effort fetch:
// the daemon dials each connected zen and requests any Like events it holds
// whose target_id matches one of the requested ids. Expensive, user-triggered.
message FetchLikesReq {
  repeated string post_ids = 1;
}

// FetchLikesResp reports the like events received from connected zens.
message FetchLikesResp {
  repeated string like_event_ids = 1;
}

// ProfileReq sets the display name. Passphrase unlocks the signing key.
message ProfileReq {
  string name = 1;
  string passphrase = 2;
}

// DetailReq sets optional profile fields. At least one field is required.
message DetailReq {
  string bio = 1;
  string first_name = 2;
  string last_name = 3;
  string location = 4;
  string passphrase = 5;
}

// Zen is a discovered or connected zen, keyed by its tailcat token.
message Zen {
  string id = 1;
  string identity = 2;
  string name = 3;
  string kind = 4;
  string status = 5;
  bool verified = 6;
}

// ZensResp lists known zens.
message ZensResp {
  repeated Zen zens = 1;
}

// Identity is one row of the follows or followers list.
message Identity {
  string identity = 1;
  string name = 2;
}

// IdentitiesResp lists identities.
message IdentitiesResp {
  repeated Identity identities = 1;
}

// FollowReq targets a zen by token or identity. Passphrase unlocks the key.
message FollowReq {
  string target = 1;
  string passphrase = 2;
}

// FollowResp reports the followed identity.
message FollowResp {
  string followed = 1;
}

// UnfollowReq targets a zen by identity. Passphrase unlocks the key.
message UnfollowReq {
  string target = 1;
  string passphrase = 2;
}

// UnfollowResp reports the unfollowed identity.
message UnfollowResp {
  string unfollowed = 1;
}

// UnlockReq supplies the passphrase to decrypt the signing key.
message UnlockReq {
  string passphrase = 1;
}

// UnlockResp reports the unlocked identity.
message UnlockResp {
  string status = 1;
  string identity = 2;
}

// StatusResp is the daemon health snapshot.
message StatusResp {
  bool running = 1;
  int32 zens = 2;
  string socket = 3;
  bool transport = 4;
  bool unlocked = 5;
}

// RotateKeyResp reports the new tailcat address token after a key rotation.
message RotateKeyResp {
  string token = 1;
}

// SubscribeReq has no parameters; the stream sends a Snapshot first, then
// incremental diff events.
message SubscribeReq {}

// Event is one message on the subscribe stream. The first is always a
// Snapshot; later events are diffs that the client applies in place by key.
message Event {
  oneof kind {
    Snapshot snapshot = 1;
    FeedDiff feed_diff = 2;
    ZenUpsert zen_upsert = 3;
    ZenRemove zen_remove = 4;
    FollowsDiff follows_diff = 5;
    FollowersDiff followers_diff = 6;
    StatusDiff status_diff = 7;
  }
}

// Snapshot is the initial subscribe event: the full state of all panels.
message Snapshot {
  repeated FeedItem feed = 1;
  repeated Zen zens = 2;
  repeated Identity follows = 3;
  repeated Identity followers = 4;
  StatusDiff status = 5;
}

// FeedDiff adds newly merged posts, newest-first.
message FeedDiff {
  repeated FeedItem add = 1;
}

// ZenUpsert updates or inserts one zen by its token id.
message ZenUpsert {
  Zen zen = 1;
}

// ZenRemove drops one zen by its token id.
message ZenRemove {
  string id = 1;
}

// FollowsDiff adds or removes one followed identity.
message FollowsDiff {
  repeated Identity add = 1;
  string remove = 2;
}

// FollowersDiff adds or removes one follower identity.
message FollowersDiff {
  repeated Identity add = 1;
  string remove = 2;
}

// StatusDiff is an updated health snapshot pushed on state changes.
message StatusDiff {
  bool running = 1;
  int32 zens = 2;
  bool transport = 3;
  bool unlocked = 4;
}
